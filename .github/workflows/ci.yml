name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src

      # tsconfig.json's include references next-env.d.ts and .next/types —
      # both generated by Next.js, neither committed (both gitignored). A
      # fresh checkout has neither, so without this, tsc fails to resolve
      # Next's own generated types (e.g. LayoutProps) before it even gets
      # to checking our code.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Test
        run: npm test

      # No Supabase/Resend secrets needed — next.config.ts and lib/email.ts
      # both fall back cleanly when those env vars are unset, so the build
      # itself doesn't depend on real credentials existing in CI.
      - name: Build
        run: npx next build
